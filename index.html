<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madeireira Pindorama | Tradição em Uberaba</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .bg-pindorama-green { background-color: #0d2c25; }
        .text-pindorama-green { color: #0d2c25; }
        .border-pindorama-green { border-color: #0d2c25; }
        .bg-wood-grain { background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png'); }
        .hero-overlay { background: linear-gradient(to bottom, rgba(13, 44, 37, 0.7) 0%, rgba(0, 0, 0, 0.4) 100%); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 1s ease-out forwards; }
        
        @keyframes strike {
          0% { transform: rotate(0deg); }
          25% { transform: rotate(-45deg); }
          50% { transform: rotate(10deg); }
          75% { transform: rotate(-10deg); }
          100% { transform: rotate(0deg); }
        }
        .animate-hammer {
          animation: strike 0.5s ease-in-out infinite;
          transform-origin: bottom left;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f5f5f4; }
        ::-webkit-scrollbar-thumb { background: #0d2c25; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #1a4d42; }
        html { scroll-behavior: smooth; }
    </style>
